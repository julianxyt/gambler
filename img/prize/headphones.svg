<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a62"/>
      <stop offset=".35" stop-color="#26262c"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".35" stop-color="#ffd54a"/>
      <stop offset=".7" stop-color="#c8860a"/>
      <stop offset="1" stop-color="#7a4a08"/>
    </linearGradient>
    <radialGradient id="cushion" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="1" stop-color="#101014"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <!-- headband -->
  <path d="M86 214 C78 70 322 70 314 214" fill="none" stroke="#0a0a0c" stroke-width="40" stroke-linecap="round"/>
  <path d="M86 214 C78 70 322 70 314 214" fill="none" stroke="url(#band)" stroke-width="32" stroke-linecap="round"/>
  <path d="M104 150 C130 92 270 92 296 150" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 118 C160 92 240 92 280 118" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>

  <!-- sliders -->
  <rect x="72" y="190" width="28" height="46" rx="8" fill="url(#gold)" stroke="#5a3000" stroke-width="2"/>
  <rect x="300" y="190" width="28" height="46" rx="8" fill="url(#gold)" stroke="#5a3000" stroke-width="2"/>

  <!-- left cup -->
  <g>
    <ellipse cx="96" cy="282" rx="66" ry="80" fill="#0a0a0c"/>
    <ellipse cx="96" cy="282" rx="60" ry="74" fill="url(#shell)"/>
    <ellipse cx="96" cy="282" rx="60" ry="74" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <ellipse cx="100" cy="282" rx="34" ry="44" fill="url(#gold)" opacity=".95"/>
    <ellipse cx="100" cy="282" rx="26" ry="35" fill="url(#shell)"/>
    <ellipse cx="78" cy="246" rx="16" ry="26" fill="#fff" opacity=".18" transform="rotate(-18 78 246)"/>
  </g>
  <!-- right cup -->
  <g>
    <ellipse cx="304" cy="282" rx="66" ry="80" fill="#0a0a0c"/>
    <ellipse cx="304" cy="282" rx="60" ry="74" fill="url(#shell)"/>
    <ellipse cx="304" cy="282" rx="60" ry="74" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <ellipse cx="300" cy="282" rx="34" ry="44" fill="url(#gold)" opacity=".95"/>
    <ellipse cx="300" cy="282" rx="26" ry="35" fill="url(#shell)"/>
    <ellipse cx="282" cy="246" rx="16" ry="26" fill="#fff" opacity=".18" transform="rotate(-18 282 246)"/>
  </g>
  <!-- cushions peeking from the inside edge -->
  <path d="M150 226 C170 250 170 314 150 338" fill="none" stroke="url(#cushion)" stroke-width="16" stroke-linecap="round"/>
  <path d="M250 226 C230 250 230 314 250 338" fill="none" stroke="url(#cushion)" stroke-width="16" stroke-linecap="round"/>
</svg>
